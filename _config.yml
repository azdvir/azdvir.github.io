# שינויים ב-_config.yml

עריכה של שורות ספציפיות בלבד — שאר הקובץ נשאר כפי שהוא.

## שינויים נדרשים (בתחילת הקובץ):

```yaml
# מ:
title: blank
first_name: You
middle_name: R.
last_name: Name

# ל:
title: blank
first_name: Amit
middle_name: Zeev
last_name: Dvir
```

```yaml
# מ:
url: https://alshedivat.github.io
baseurl: /al-folio

# ל:
url: https://azdvir.github.io
baseurl:
```

## שינויים בסעיף scholar (כ-⅔ בקובץ):

```yaml
# מ:
scholar:
  last_name: [Einstein]
  first_name: [Albert, A.]

# ל:
scholar:
  last_name: [Dvir]
  first_name: [Amit, A., Amit Zeev]
```
